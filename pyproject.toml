[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangainpaint"
version = "0.1.0"
description = "Transfer, distillation and benchmark design for small-data manga inpainting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.24",
  "opencv-python>=4.7",
  "scikit-image>=0.20",
  "pillow>=9.5",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "omegaconf>=2.3",
  "lpips>=0.1.4",
]

[project.optional-dependencies]
diffusion = ["diffusers>=0.27", "transformers>=4.38", "accelerate>=0.27"]

# NOTE: `saicinpainting` is a hard dependency of the teacher, the student
# family and DistillLoss, but it is not published on PyPI. It is loaded from
# a clone of https://github.com/advimman/lama at ./external/lama, which the
# modules put on sys.path themselves. See the Setup section of README.md.

[tool.setuptools]
packages = ["mangainpaint"]
